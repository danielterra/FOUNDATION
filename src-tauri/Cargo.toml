[package]
name = "FOUNDATION"
version = "0.5.1"
description = "A Tauri App"
authors = ["daniel_terra@icloud.com"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "FOUNDATION_tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
lazy_static = "1.4"
sha2 = "0.10"
chrono = "0.4"
sysinfo = "0.32"  # For system information
hostname = "0.4"  # For hostname detection
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "io-util"] }  # For async executor and tests
axum = { version = "0.7", features = ["json"] }  # For embedded MCP HTTP server
reqwest = { version = "0.12", features = ["blocking", "json"] }  # For HTTP API calls
async-trait = "0.1"  # For async trait definitions
tiktoken-rs = "0.6"  # For accurate token counting (Claude/GPT compatible)
base64 = "0.22.1"
pdf-extract = "0.10.0"
image = "0.25.9"

[dev-dependencies]
tempfile = "3.8"  # Temporary files for tests
