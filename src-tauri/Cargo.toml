[package]
name = "FOUNDATION"
version = "0.18.1"
description = "A Tauri App"
authors = ["daniel_terra@icloud.com"]
edition = "2021"
default-run = "FOUNDATION"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "FOUNDATION_tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cleanup_orphans"
path = "src/bin/cleanup_orphans.rs"

[[bin]]
name = "purge_retracted"
path = "src/bin/purge_retracted.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "test", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
lazy_static = "1.4"
sha2 = "0.10"
chrono = "0.4"
cron = "0.12"
sysinfo = "0.32"  # For system information
hostname = "0.4"  # For hostname detection
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "io-util"] }  # For async executor and tests
axum = { version = "0.7", features = ["json"] }  # For embedded MCP HTTP server
axum-server = { version = "0.7", features = ["tls-rustls"] }  # HTTPS for MCP
rcgen = "0.13"  # Self-signed TLS certificate generation
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }  # For HTTP API calls
futures-util = "0.3"  # For SSE stream processing
async-trait = "0.1"  # For async trait definitions
tiktoken-rs = "0.6"  # For accurate token counting (Claude/GPT compatible)
base64 = "0.22.1"
pdf-extract = "0.10.0"
lopdf = "0.34"
image = "0.25.9"
libc = "0.2"
tantivy = "0.22"
encoding_rs = "0.8"
rhai = { version = "^1", features = ["sync"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
mailparse = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.143", features = ["metal", "sampler"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.143", features = ["sampler"] }

[dev-dependencies]
tempfile = "3.8"  # Temporary files for tests

[profile.dev]
incremental = true
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
