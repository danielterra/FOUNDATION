[package]
name = "ontology-base-pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
oxttl = "0.2.5"
oxrdf = "0.3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
foundation-core = { path = "../../../foundation-core" }
